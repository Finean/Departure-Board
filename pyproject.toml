[project]
name = "depboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cocotb>=2.1.0",
]

[project.scripts]
depboard = "depboard:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "formal: SymbiYosys formal verification tests",
    "sim: Cocotb simulation tests"
]
testpaths = ["sv_tests.py"]
